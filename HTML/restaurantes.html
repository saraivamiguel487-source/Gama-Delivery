<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Restaurante</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav class="area-navegacao">
            <img class="logo" src="" alt="logo do site" width="100px">
            <ul>
                <li><a class="icones" href="index.html"><i class="fa-solid fa-house"></i></a></li>
                <li><a class="icones" href="comidas.html"><i class="fa-solid fa-utensils"></i></a></li>
                <li><a class="icones" href="acompanhamentos_na_comida.html"><i class="fa-solid fa-store"></i></a></li>
                <li><a class="icones" href="quiosques.html"><i class="fa-solid fa-store"></i></a></li>
                <li><a class="icones" href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a class="icones" href="login_dos_clientes.html"><i class="fa-solid fa-user"></i></a></li>
                <li><a class="icones" href="login_dos_entregadores.html"><i class="fa-solid fa-motorcycle"></i></a></li>
            </ul>
        </nav>
    </header>
    <main class="area-cadastro">
        <section class="area-titulo">
            <!-- CORRIGIDO: Adicionado o título interno que estava vazio -->
            <h1>Cadastro de Restaurante</h1>
        </section>
        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-cadastrar">
                <div class="area-nome formatacao">
                    <div class="nome titulo-campo">
                        <label for="nome">Nome do restaurante:</label>
                        <input type="text" id="nome" required placeholder="Digite o nome completo do restaurante.">
                    </div>
                </div>
                <div class="area-acesso formatacao">
                    <div class="email titulo-campo">
                        <label for="email">E-mail do restaurante:</label>
                        <input type="email" id="email" placeholder="Digite o e-mail do restaurante." required>
                        <span id="erro-email" class="erro-email"></span>
                    </div>
                </div>
                <div class="area-contato formatacao">
                    <div class="telefone titulo-campo">
                        <label for="telefone">Telefone do restaurante:</label>
                        <input type="text" id="telefone" placeholder="Digite o telefone do restaurante." required>
                    </div>
                    <div class="CNPJ titulo-campo">
                        <label for="CNPJ">CNPJ do restaurante:</label>
                        <input type="text" id="CNPJ" placeholder="Digite o CNPJ do restaurante.">
                    </div>
                </div>
                <div class="area-endereco formatacao area-endereco-bloco">
                    <div class="endereco-numero">
                        <div class="Endereco titulo-campo">
                            <label for="endereco">Endereço do restaurante:</label>
                            <input type="text" id="endereco" placeholder="Digite o endereço do restaurante.">
                        </div>
                    </div>
                </div>
                <div class="area-botao">
                    <button type="submit" id="botao-cadastrar">Cadastrar</button>
                    <a href="login.html" class="link-login">Já possui uma conta? Acesse agora!</a>
                </div>
            </form>
        </section>
    </main>
    <script src="js/login-cadastrar.js"></script>
</body>
</html>
