<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Login dos clientes do Gama Delivery</title>
</head>
<body>
    <header>
        <nav class="area-navegação">
            <img class="logo" src="" alt="logo do site" width="100px">
            <ul>
                <li><a class="icones" href="index.html"><i class="fa-solid fa-house"></i></a></li>
                <li><a class="icones" href="#Comidas"><i class="fa solid fa-"></i></a></li>
                <li><a class="icones" href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a class="icones" href="login.html"><i class="fa-solid fa-user"></i></a></li>
            </ul>
        </nav>
    </header>

    <main class="area-cadastro">
        <section class="area-titulo formatacao">
            <h1>Login do Gama Delivery</h1>
        </section>
        <section class="area-formulario formatacao">
            <form action="#" class="form-cadastro" id="form-logar">
                <div class="area-acesso formatacao">
                    <div class="email titulo-campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="digite o seu e-mail" required>
                    </div>
                    <div class="senha titulo-campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="······" required>
                    </div>
                </div>


                <div class="area-botao formatacao">
                    <button type="submit" id="botao-cadastrar">

                        Entrar

                    </button>
                    <a href="#" class="link-login">Esqueceu a sua senha? Clique aqui!</a>
                    <a href="Cadastro_dos_clientes.html" class="link-login">Ainda não possui uma conta? Clique aqui para
                        cadastrar-se!</a>
                </div>

            </form>

</body>

</html>
