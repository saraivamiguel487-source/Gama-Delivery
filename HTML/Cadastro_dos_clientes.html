<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro_dos_clientes.css">
    <!-- Corrigido: URLs completas do Bootstrap e Font Awesome -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cadastro dos clientes do Gama Delivery</title>
</head>

<body class="formatacao">
    <header>
        <!-- Corrigido: Removido caracteres especiais da classe de navegação -->
        <nav class="area-navegacao">
            <img class="logo" src="img/logo-tia-sonia.png" alt="logo do site" width="100px">
<div class="area-botao"></div>
        </nav>
    </header>

    <main class="area-cadastro">
        <section class="area-titulo">
            <h1>Cadastre-se como cliente</h1>
        </section>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-cadastrar">
                
                <!-- Nome e CPF -->
                <div class="linha-dupla">
                    <div class="nome titulo-campo flex-3">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" required placeholder="Digite o seu nome completo.">
                    </div>
                    <div class="area-cpf titulo-campo flex-2">
                        <label for="CPF">CPF:</label>
                        <input type="text" id="CPF" required placeholder="Digite o seu CPF.">
                    </div>
                </div>

                <!-- Credenciais de Acesso -->
                <div class="linha-dupla">
                    <div class="email titulo-campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite o seu e-mail." required>
                        <span id="erro-email" class="erro-email"></span>
                    </div>
                    <div class="senha titulo-campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="······" required>
                        <span id="erro-senha" class="erro-senha"></span>
                    </div>
                </div>

                <!-- Contato -->
                <div class="linha-dupla">
                    <div class="ddd titulo-campo flex-1">
                        <label for="ddd">DDD:</label>
                        <input type="number" max="99" id="ddd" placeholder="DDD">
                        <span id="erro-ddd" class="erro-ddd"></span>
                    </div>
                    <div class="telefone titulo-campo flex-4">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="Digite seu telefone" required>
                    </div>
                </div>

                <!-- Endereço: Rua e Número -->
                <div class="linha-dupla">
                    <!-- Corrigido: Removido caractere especial do nome da classe -->
                    <div class="endereco titulo-campo flex-4">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" placeholder="Digite seu endereço.">
                    </div>
                    <div class="numero titulo-campo flex-1">
                        <label for="numero">Número:</label>
                        <input type="number" id="numero" placeholder="000">
                    </div>
                </div>

                <!-- Endereço: Cidade e CEP -->
                <div class="linha-dupla">
                    <div class="cidade titulo-campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" placeholder="Cidade">
                    </div>
                    <div class="cep titulo-campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                </div>

                <!-- Dados Pessoais -->
                <div class="linha-dupla">
                    <div class="data-nascimento titulo-campo">
                        <label for="data-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-nascimento" required>
                    </div>
                    <div class="genero titulo-campo">
                        <label for="genero">Gênero:</label>
                        <select id="genero" required>
                            <option value="">Selecione o seu gênero:</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                            <option value="omitido">Prefiro não dizer</option>
                        </select>
                    </div>
                </div>

                <!-- Botão e Links -->
                <div class="area-botao">
                    <button type="submit" id="botao-cadastrar">Cadastrar</button>
                    <!-- Corrigido: Ajustado o nome do arquivo para login_dos_clientes.html -->
                    <a href="login_dos_clientes.html" class="link-login">Já possui uma conta? Acesse agora!</a>
                </div>

            </form>
        </section>
    </main>

    <script src="js/login-cadastrar.js"></script>
</body>
</html>
