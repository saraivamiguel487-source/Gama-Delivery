<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Carrinho - Gama Delivery</title>
</head>

<body>
    <header>
        <nav class="area-navegação">
            <img class="logo" src="IMG/Gama_Delivery.jpg" alt="Logo do site" width="150px">
            <div class="area-botao">
                <ul>
                    <li><a href="index.html" class="botao">Voltar para a página inicial</a></li>
                    <li><a href="carrinho.html" class="botao">Carrinho</a></li>
                    <li><a href="login_dos_clientes.html" class="botao">Login dos Clientes</a></li>
                    <li><a href="login_dos_entregadores.html" class="botao">Login dos Entregadores</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <article class="area-banner" id="Home">
        <section id="banner">
            <img src="IMG/Banner-Gama_Delivery.jpg" alt="Banner Principal" id="banner__image">
        </section>
    </article>
    <main class="container mt-5">
        <h2 class="mb-4">Seu Carrinho</h2>
        <table class="table table-striped" id="tabela-carrinho">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <tbody id="lista-produtos">
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <h4 id="texto-total">Total: R$ 0,00</h4>
            <button id="btn-finalizar" class="btn btn-success btn-lg">Finalizar Pedido</button>
        </div>
    </main>

    <script src="js/Carrinho-logado.js"></script>
</body>

</html>
