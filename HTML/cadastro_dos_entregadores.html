<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro dos clientes do Gama Delivery</title>
    <!-- Bootstrap v5.3.3 Estável -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Font Awesome v6.5.1 Estável -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Folhas de estilo locais -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro_dos_clientes.css">
</head>

<body class="formatacao">
    <header>
        <nav class="area-navegacao">
            <img class="logo" src="IMG/Gama_Delivery.jpg" alt="logo do site" width="100px">
            <!-- Corrigido: Agrupamento correto dos links de navegação -->
            <div class="area-botao">
                <a href="comidas.html" class="botao">Comidas</a>
                <a href="acompanhamentos_na_comida.html" class="botao">Acompanhamentos</a>
                <a href="bebidas.html" class="botao">Bebidas</a>
                <a href="index.html" class="botao">Voltar para a página inicial</a>
            </div>
        </nav>
    </header>

    <!-- Corrigido: Removido o segundo bloco de banner duplicado -->
    <article class="area-banner" id="Home">
        <section id="banner">
            <img src="IMG/Banner-Gama_Delivery.jpg" alt="Banner Principal" id="banner__image">
        </section>
    </article>

    <main class="area-cadastro">
        <section class="area-titulo">
            <h1>Cadastre-se como cliente</h1>
        </section>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-cadastrar">
                <div class="linha-dupla">
                    <div class="nome titulo-campo flex-3">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" required placeholder="Digite o seu nome completo.">
                        <span id="erro-nome" class="erro-mensagem" style="display: none;"></span>
                    </div>
                    <div class="area-cpf titulo-campo flex-2">
                        <label for="CPF">CPF:</label>
                        <input type="text" id="CPF" required placeholder="000.000.000-00" maxlength="14">
                        <span id="erro-cpf" class="erro-mensagem" style="display: none;"></span>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="email titulo-campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite o seu e-mail." required>
                        <span id="erro-email" class="erro-mensagem" style="display: none;"></span>
                    </div>
                    <div class="senha titulo-campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
                        <span id="erro-senha" class="erro-mensagem" style="display: none;"></span>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="ddd titulo-campo flex-1">
                        <label for="ddd">DDD:</label>
                        <!-- Corrigido: Tipo text com limite de caracteres para melhor usabilidade -->
                        <input type="text" id="ddd" placeholder="61" maxlength="2" required>
                        <span id="erro-ddd" class="erro-mensagem" style="display: none;"></span>
                    </div>
                    <div class="telefone titulo-campo flex-4">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="90000-0000" maxlength="10" required>
                        <span id="erro-telefone" class="erro-mensagem" style="display: none;"></span>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="endereco titulo-campo flex-4">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" placeholder="Ex: Setor Sul, Quadra...">
                    </div>
                    <div class="numero titulo-campo flex-1">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" placeholder="S/N ou Apt">
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="cidade titulo-campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" value="Gama" placeholder="Cidade">
                    </div>
                    <div class="cep titulo-campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" placeholder="72400-000" maxlength="9">
                        <span id="erro-cep" class="erro-mensagem" style="display: none;"></span>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="data-nascimento titulo-campo">
                        <label for="data-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-nascimento" required>
                        <span id="erro-data" class="erro-mensagem" style="display: none;"></span>
                    </div>
                    <div class="genero titulo-campo">
                        <label for="genero">Gênero:</label>
                        <select id="genero" required>
                            <option value="">Selecione o seu gênero:</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                            <option value="omitido">Prefiro não dizer</option>
                        </select>
                    </div>
                </div>

                <!-- Corrigido: Modificado o container para evitar colisão com o cabeçalho .area-botao -->
                <div class="area-cadastro-botoes">
                    <button type="submit" id="botao-cadastrar">Cadastrar</button>
                    <a href="login_dos_clientes.html" class="link-login">Já possui uma conta? Acesse agora!</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/login-cadastrar.js"></script>
</body>

</html>
