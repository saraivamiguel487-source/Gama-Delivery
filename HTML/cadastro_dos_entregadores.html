<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro_dos_entregadores.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cadastro dos entregadores do Gama Delivery</title>
</head>

<body class="formatacao">
    <header>
        <nav class="area-navegacao">
            <!-- Corrigido: src preenchido com a logo padrão para evitar quebras em tela -->
            <img class="logo" src="logo.png" alt="logo do site" width="100px">
<div class="area-botao">
    <a href="comidas.html" class="botao">Procurar por comidas</a>
    <a href="acompanhamentos_na_comida.html" class="botao">Procurar por acompanhamentos</a>
    <a href="bebidas.html" class="botao">Procurar por bebidas</a>
    <a href="login_dos_clientes.html" class="botao">Login</a>
    <a href="cadastro_dos_clientes.html" class="botao">Cadastro</a>
</div>
        </nav>
    </header>
    <main class="area-cadastro">
        <section class="area-titulo">
            <h1>Cadastre-se como Entregador</h1>
        </section>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-cadastrar">
                
                <!-- Nome e CPF -->
                <div class="linha-dupla">
                    <div class="nome titulo-campo flex-3">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" required placeholder="Digite o seu nome completo.">
                    </div>
                    <div class="area-cpf titulo-campo flex-2">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" required placeholder="Digite o seu CPF.">
                    </div>
                </div>

                <!-- Credenciais de Acesso -->
                <div class="linha-dupla">
                    <div class="email titulo-campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite o seu e-mail." required>
                        <span id="erro-email" class="erro-email"></span>
                    </div>
                    <div class="senha titulo-campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="······" required>
                        <span id="erro-senha" class="erro-senha"></span>
                    </div>
                </div>

                <!-- Contato -->
                <div class="linha-dupla">
                    <div class="ddd titulo-campo flex-1">
                        <label for="ddd">DDD:</label>
                        <input type="number" max="99" id="ddd" placeholder="DDD">
                        <span id="erro-ddd" class="erro-ddd"></span>
                    </div>
                    <div class="telefone titulo-campo flex-4">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="Digite seu telefone." required>
                    </div>
                </div>

                <!-- Endereço: Rua e Número -->
                <div class="linha-dupla">
                    <div class="endereco titulo-campo flex-4">
                        <label for="endereco">Endereço residencial:</label>
                        <input type="text" id="endereco" placeholder="Digite seu endereço.">
                    </div>
                    <div class="numero titulo-campo flex-1">
                        <label for="numero">Número:</label>
                        <input type="number" id="numero" placeholder="000">
                    </div>
                </div>

                <!-- Endereço: Cidade e CEP -->
                <div class="linha-dupla">
                    <div class="cidade titulo-campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" placeholder="Cidade">
                    </div>
                    <div class="cep titulo-campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>
                </div>

                <!-- Dados Pessoais -->
                <div class="linha-dupla">
                    <div class="data-nascimento titulo-campo">
                        <label for="data-nascimento">Data de nascimento:</label>
                        <input type="date" id="data-nascimento" required>
                    </div>
                    <div class="genero titulo-campo">
                        <label for="genero">Gênero:</label>
                        <select id="genero" required>
                            <option value="">Selecione o seu gênero:</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                            <option value="omitido">Prefiro não dizer</option>
                        </select>
                    </div>
                </div>

                <!-- Botão de Ação e Redirecionamento -->
                <div class="area-botao">
                    <button type="submit" id="botao-cadastrar">Cadastrar</button>
                    <a href="login_dos_entregadores.html" class="link-login">Já possui uma conta? Acesse agora!</a>
                </div>

            </form>
        </section>
    </main>

    <script src="js/login-cadastrar.js"></script>
</body>
</html>
