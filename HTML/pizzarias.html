<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar Restaurante - Gama Delivery</title>
    <!-- CORRIGIDO: Link estável do Bootstrap v5.3.3 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- CORRIGIDO: Link estável do Font Awesome v6.5.1 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Folhas de estilo locais -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/pizzarias.css">
</head>
<body>
    <header>
        <nav class="area-navegacao">
            <img class="logo" src="IMG/Gama_Delivery.jpg" alt="logo do site" width="100px">
            <!-- Corrigido: Classe alterada para nav-botoes para isolar do formulário -->
            <div class="nav-botoes">
                <a href="index.html" class="botao">Voltar para a página inicial</a>
                <a href="comidas.html" class="botao">Comidas</a>
                <a href="acompanhamentos_na_comida.html" class="botao">Acompanhamentos</a>
                <a href="bebidas.html" class="botao">Bebidas</a>
                <a href="login_dos_clientes.html" class="botao">Login dos Clientes</a>
                <a href="login_dos_entregadores.html" class="botao">Login dos Entregadores</a>
            </div>
        </nav>
    </header>

    <article class="area-banner" id="Home">
        <section id="banner">
            <img src="IMG/Banner-Gama_Delivery.jpg" alt="Banner Principal" id="banner__image">
        </section>
    </article>

    <!-- Corrigido: Mudado para area-cadastro para reaproveitar o escopo visual centralizado -->
    <main class="area-cadastro">
        <section class="area-titulo">
            <h1>Procurar pizzaria</h1>
        </section>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-procurar-pizzaria">
                
                <!-- Linha 1: Nome e CNPJ -->
                <div class="linha-dupla">
                    <div class="nome titulo-campo flex-3">
                        <label for="nome">Nome da pizzaria procurada:</label>
                        <input type="text" id="nome" required placeholder="Digite o nome completo da pizzaria.">
                    </div>
                    <div class="cnpj titulo-campo flex-2">
                        <label for="CNPJ">CNPJ da pizzaria:</label>
                        <input type="text" id="CNPJ" placeholder="Digite o CNPJ da pizzaria.">
                    </div>
                </div>

                <!-- Linha 2: E-mail e Telefone -->
                <div class="linha-dupla">
                    <div class="email titulo-campo flex-1">
                        <label for="email">E-mail da pizzaria:</label>
                        <input type="email" id="email" placeholder="Digite o e-mail da pizzaria." required>
                        <span id="erro-email" class="erro-email"></span>
                    </div>
                    <div class="telefone titulo-campo flex-1">
                        <label for="telefone">Telefone de contato:</label>
                        <input type="text" id="telefone" placeholder="Digite o telefone da pizzaria." required>
                    </div>
                </div>

                <!-- Linha 3: Endereço Único Completo -->
                <div class="linha-dupla">
                    <div class="endereco titulo-campo flex-1">
                        <label for="endereco">Endereço da pizzaria:</label>
                        <input type="text" id="endereco" placeholder="Digite o endereço completo da pizzaria.">
                    </div>
                </div>

                <!-- Corrigido: Botões transformados em links reais para navegação direta -->
                <div class="area-form-botoes">
                    <a href="comidas.html" class="link-botao-procurar">
                        <i class="fa-solid fa-utensils pe-2"></i> Procurar por comidas
                    </a>
                    <a href="acompanhamentos_na_comida.html" class="link-botao-procurar">
                        <i class="fa-solid fa-cookie pe-2"></i> Procurar por acompanhamentos na minha comida
                    </a>
                    <a href="bebidas.html" class="link-botao-procurar">
                        <i class="fa-solid fa-mug-hot pe-2"></i> Procurar por bebidas
                    </a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/pizzarias.js"></script>
</body>

</html>
