<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar Pizzaria</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="pizzarias.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="area-navegacao">
            <img class="logo" src="Gama_Delivery.jpg" alt="logo do site" width="100px">
            <div class="area-botao">
                <a href="index.html" class="botao">Voltar para a página inicial</a>
                <a href="comidas.html" class="botao">Comidas</a>
                <a href="acompanhamentos_na_comida.html" class="botao">Acompanhamentos</a>
                <a href="bebidas.html" class="botao">Bebidas</a>
                <a href="Login_dos_clientes.html" class="botao">Login dos Clientes</a>
                <a href="Login_dos_entregadores.html" class="botao">Login dos Entregadores</a>
            </div>
        </nav>
    </header>
    <article class="area-banner" id="Home">
        <section id="banner">
            <img src="Banner-Gama_Delivery.jpg" alt="Banner Principal" id="banner__image">
        </section>
    </article>
    <main class="area-procurar-pizzaria">
        <section class="area-titulo">
            <h1>Procurar Pizzaria</h1>
        </section>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-cadastrar">
                <div class="area-nome formatacao">
                    <div class="nome titulo-campo">
                        <label for="nome">Nome da pizzaria procurada:</label>
                        <input type="text" id="nome" required placeholder="Digite o nome completo da pizzaria">
                    </div>
                </div>

                <div class="area-acesso formatacao">
                    <div class="email titulo-campo">
                        <label for="email">E-mail da pizzaria procurada:</label>
                        <input type="email" id="email" placeholder="Digite o e-mail da pizzaria" required>
                        <span id="erro-email" class="erro-email"></span>
                    </div>
                </div>

                <div class="area-contato formatacao">
                    <div class="telefone titulo-campo">
                        <label for="telefone">Telefone do pizzaria procurada:</label>
                        <input type="text" id="telefone" placeholder="Digite o telefone da pizzaria" required>
                    </div>
                    <div class="CNPJ titulo-campo">
                        <label for="CNPJ">CNPJ do pizzaria procurada:</label>
                        <input type="text" id="CNPJ" placeholder="Digite o CNPJ da pizzaria">
                    </div>
                </div>

                <div class="area-endereco formatacao area-endereco-bloco">
                    <div class="endereco-numero">
                        <div class="Endereco titulo-campo">
                            <label for="endereco">Endereço do pizzaria procurada:</label>
                            <input type="text" id="endereco" placeholder="Digite o endereço da pizzaria">
                        </div>
                    </div>
                </div>

                <div class="area-botao">
                    <button type="submit" id="botao-cadastrar">Procurar por comidas</button>
                    <a href="Comidas.html"></a>
                    <button type="submit" id="botao-procurar">Procurar por acompanhamentos na minha comida</button>
                    <a href="Acompanhamentos_na_comida.html"></a>
                    <button type="submit" id="botao-procurar">Procurar por bebidas</button>
                    <a href="Bebidas.html"></a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/pizzarias.js"></script>
</body>

</html>
